[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-aware-fusion-diagnostic"
version = "0.1.0"
description = "Leakage-safe Clean-Q/Broken-Q diagnostic for quality-aware multimodal fusion."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  {name = "Jaden Moon"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
mosei = ["mmsdk"]

[tool.setuptools.packages.find]
where = ["src"]
